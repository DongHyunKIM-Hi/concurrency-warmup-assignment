<svg viewBox="20 20 960 440" width="960" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="쿠폰과 회의실 예약 구조: 요청을 보내는 쪽이 쿠폰 컨트롤러와 예약 컨트롤러를 각각 호출하고, 각 컨트롤러는 수정할 수 없는 저장소를 사용한다. 두 기능은 서로 연결되어 있지 않다">
<title>과제 4 서버 구조</title>
<desc>요청을 보내는 쪽에서 쿠폰 컨트롤러(TODO, 직접 구현)와 예약 컨트롤러(TODO, 직접 구현)를 각각 호출한다. 쿠폰 컨트롤러는 쿠폰 저장소를, 예약 컨트롤러는 예약 저장소를 사용하며 두 저장소는 수정할 수 없다.</desc>
<rect x="20" y="20" width="960" height="440" fill="#ffffff"/>

<defs>
  <marker id="wa-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="wa-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>

<!-- 요청자 -->
<rect x="30" y="170" width="180" height="120" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#312e81">
  <tspan x="120" y="225" font-size="14" font-weight="700">요청을 보내는 쪽</tspan>
  <tspan x="120" y="247" font-size="12">(Swagger / curl)</tspan>
</text>

<!-- 쿠폰 컨테이너 -->
<rect x="270" y="35" width="690" height="170" rx="14" fill="#fbfbfc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="290" y="60" font-size="14" font-weight="700" fill="#334155" font-family="sans-serif">쿠폰</text>

<rect x="300" y="85" width="240" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#1e3a8a">
  <tspan x="420" y="117" font-size="14" font-weight="700">쿠폰 컨트롤러</tspan>
  <tspan x="420" y="137" font-size="11.5">발급, 사용 (TODO, 직접 구현)</tspan>
</text>

<rect x="680" y="85" width="250" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#334155">
  <tspan x="805" y="112" font-size="14" font-weight="700">쿠폰 저장소</tspan>
  <tspan x="805" y="132" font-size="11.5">(수정 금지)</tspan>
  <tspan x="805" y="150" font-size="11" fill="#b45309">호출마다 지연, 내부 리스트를 그대로 반환</tspan>
</text>

<line x1="540" y1="125" x2="678" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#wa-arrow-gray)"/>
<text x="609" y="115" text-anchor="middle" font-size="11" fill="#334155" font-family="sans-serif">조회, 저장, 삭제</text>

<!-- 회의실 예약 컨테이너 -->
<rect x="270" y="245" width="690" height="170" rx="14" fill="#fbfbfc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="290" y="270" font-size="14" font-weight="700" fill="#334155" font-family="sans-serif">회의실 예약</text>

<rect x="300" y="295" width="240" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#1e3a8a">
  <tspan x="420" y="327" font-size="14" font-weight="700">예약 컨트롤러</tspan>
  <tspan x="420" y="347" font-size="11.5">생성, 사용자별 조회 (TODO, 직접 구현)</tspan>
</text>

<rect x="680" y="295" width="250" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#334155">
  <tspan x="805" y="322" font-size="14" font-weight="700">예약 저장소</tspan>
  <tspan x="805" y="342" font-size="11.5">(수정 금지)</tspan>
  <tspan x="805" y="360" font-size="11" fill="#b45309">회의실 단위로 예약을 저장</tspan>
</text>

<line x1="540" y1="335" x2="678" y2="335" stroke="#64748b" stroke-width="1.5" marker-end="url(#wa-arrow-gray)"/>
<text x="609" y="325" text-anchor="middle" font-size="11" fill="#334155" font-family="sans-serif">조회, 저장</text>

<!-- 요청 화살표 -->
<path d="M210,205 L255,205 L255,125 L298,125" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#wa-arrow-blue)"/>
<path d="M210,255 L255,255 L255,335 L298,335" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#wa-arrow-blue)"/>

<text x="615" y="232" text-anchor="middle" font-size="11.5" fill="#64748b" font-family="sans-serif">두 기능은 코드와 데이터를 공유하지 않습니다</text>

<!-- 범례 -->
<rect x="30" y="425" width="14" height="14" fill="#dbeafe" stroke="#3b82f6"/>
<text x="50" y="436" font-size="12" fill="#334155" font-family="sans-serif">직접 구현하는 부분</text>
<rect x="190" y="425" width="14" height="14" fill="#f1f5f9" stroke="#64748b"/>
<text x="210" y="436" font-size="12" fill="#334155" font-family="sans-serif">수정 금지 (제공됨)</text>
</svg>
